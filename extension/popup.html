<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Team Brain</h1>
    </div>

    <div class="status-row">
      <span id="status-text">Tracking</span>
      <button id="toggle-btn" class="toggle-btn">Pause</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="signal-count">0</span>
        <span class="stat-label">signals today</span>
      </div>
    </div>

    <button id="extract-btn" class="extract-btn">Extract now</button>

    <div class="last-extraction" id="last-extraction">
      No extractions yet
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
