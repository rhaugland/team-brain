<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Brain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    .header {
      background: #1a1a2e;
      color: #fff;
      padding: 24px 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .header p {
      font-size: 14px;
      color: #a0a0b8;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 0;
      background: #1a1a2e;
      padding: 0 32px;
    }

    .tab {
      padding: 12px 24px;
      cursor: pointer;
      color: #a0a0b8;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover { color: #fff; }

    .tab.active {
      color: #fff;
      border-bottom-color: #6c63ff;
    }

    .search-bar {
      padding: 20px 32px;
      background: #fff;
      border-bottom: 1px solid #e8e8ef;
    }

    .search-bar input {
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      border: 1px solid #d1d1e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: #6c63ff;
    }

    .content {
      padding: 24px 32px;
      max-width: 960px;
    }

    .person-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      border: 1px solid #e8e8ef;
    }

    .person-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .person-subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-chip {
      background: #eef0ff;
      color: #4a45b0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .skill-chip:hover {
      background: #6c63ff;
      color: #fff;
    }

    .skill-chip.active {
      background: #6c63ff;
      color: #fff;
    }

    .project-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      border: 1px solid #e8e8ef;
    }

    .project-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .project-people {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }

    .project-section-label {
      font-size: 12px;
      font-weight: 600;
      color: #a0a0b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .learning-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
      border: 1px solid #e8e8ef;
      border-left: 4px solid #6c63ff;
    }

    .learning-card.high { border-left-color: #e74c3c; }
    .learning-card.medium { border-left-color: #f39c12; }

    .learning-text {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .learning-meta {
      font-size: 13px;
      color: #888;
    }

    .learning-meta span {
      margin-right: 16px;
    }

    .importance-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .importance-badge.high { background: #fde8e8; color: #e74c3c; }
    .importance-badge.medium { background: #fef3e2; color: #f39c12; }

    .category-section {
      margin-bottom: 24px;
    }

    .category-header {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef0ff;
    }

    .category-skill-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #fff;
      border: 1px solid #e8e8ef;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .category-skill-name {
      font-size: 14px;
      font-weight: 500;
    }

    .category-skill-people {
      display: flex;
      gap: 6px;
    }

    .person-badge {
      background: #eef0ff;
      color: #4a45b0;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .hidden { display: none; }

    .stats {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Team Brain</h1>
    <p>Skills and learnings across your team</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="individual">Individual</div>
    <div class="tab" data-tab="project">Project</div>
    <div class="tab" data-tab="company">Company</div>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search skills, people, or projects...">
  </div>

  <div class="content">
    <div id="individual-panel">
      <div class="stats" id="individual-stats"></div>
      <div id="individual-list"></div>
    </div>

    <div id="project-panel" class="hidden">
      <div class="stats" id="project-stats"></div>
      <div id="project-list"></div>
    </div>

    <div id="company-panel" class="hidden">
      <div class="stats" id="company-stats"></div>
      <div id="company-list"></div>
    </div>
  </div>

  <script>
    let skillsData = [];
    let learningsData = [];
    let activeTab = 'individual';
    let searchQuery = '';

    async function loadData() {
      try {
        const [skillsRes, learningsRes] = await Promise.all([
          fetch('/data/skills.json').then(r => r.json()).catch(() => []),
          fetch('/data/learnings.json').then(r => r.json()).catch(() => [])
        ]);
        skillsData = skillsRes;
        learningsData = learningsRes;
        render();
      } catch (e) {
        document.querySelector('.content').innerHTML =
          '<div class="empty-state"><p>Could not load data files.</p></div>';
      }
    }

    // --- Individual Tab ---
    function renderIndividual() {
      const container = document.getElementById('individual-list');
      const statsEl = document.getElementById('individual-stats');
      const query = searchQuery.toLowerCase();

      let filtered = skillsData;
      if (query) {
        filtered = filtered.filter(s =>
          s.skill.toLowerCase().includes(query) ||
          s.person.toLowerCase().includes(query)
        );
      }

      const groups = {};
      for (const s of filtered) {
        if (!groups[s.person]) groups[s.person] = [];
        groups[s.person].push(s);
      }
      for (const person in groups) {
        groups[person].sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      const people = Object.keys(groups).sort();
      const uniqueSkills = new Set(skillsData.map(s => s.skill.toLowerCase()));
      statsEl.textContent = `${people.length} people, ${uniqueSkills.size} unique skills`;

      if (people.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No individuals found.</p></div>';
        return;
      }

      container.innerHTML = people.map(person => {
        const projects = [...new Set(groups[person].map(s => s.project))].join(', ');
        return `
          <div class="person-card">
            <div class="person-name">${person}</div>
            <div class="person-subtitle">${groups[person].length} skills across ${projects}</div>
            <div class="skills-list">
              ${groups[person].map(s => `
                <div class="skill-chip">${s.skill}</div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // --- Project Tab ---
    function renderProject() {
      const container = document.getElementById('project-list');
      const statsEl = document.getElementById('project-stats');
      const query = searchQuery.toLowerCase();

      // Group skills by project
      const projectSkills = {};
      for (const s of skillsData) {
        if (!projectSkills[s.project]) projectSkills[s.project] = [];
        projectSkills[s.project].push(s);
      }

      // Group learnings by project
      const projectLearnings = {};
      for (const l of learningsData) {
        if (!projectLearnings[l.project]) projectLearnings[l.project] = [];
        projectLearnings[l.project].push(l);
      }

      let projects = [...new Set([...Object.keys(projectSkills), ...Object.keys(projectLearnings)])].sort();

      if (query) {
        projects = projects.filter(p => {
          const skills = projectSkills[p] || [];
          const learnings = projectLearnings[p] || [];
          return p.toLowerCase().includes(query) ||
            skills.some(s => s.skill.toLowerCase().includes(query) || s.person.toLowerCase().includes(query)) ||
            learnings.some(l => l.learning.toLowerCase().includes(query));
        });
      }

      statsEl.textContent = `${projects.length} projects`;

      if (projects.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No projects found.</p></div>';
        return;
      }

      container.innerHTML = projects.map(project => {
        const skills = projectSkills[project] || [];
        const learnings = projectLearnings[project] || [];
        const people = [...new Set(skills.map(s => s.person))];
        const importanceOrder = { high: 0, medium: 1, low: 2 };
        learnings.sort((a, b) => (importanceOrder[a.importance] || 2) - (importanceOrder[b.importance] || 2));

        return `
          <div class="project-card">
            <div class="project-name">${project}</div>
            <div class="project-people">${people.join(', ') || 'No people'}</div>

            ${skills.length > 0 ? `
              <div class="project-section-label">Skills gained</div>
              <div class="skills-list">
                ${skills.map(s => `
                  <div class="skill-chip" title="${s.person}">${s.skill}</div>
                `).join('')}
              </div>
            ` : ''}

            ${learnings.length > 0 ? `
              <div class="project-section-label">Learnings</div>
              ${learnings.map(l => `
                <div class="learning-card ${l.importance}">
                  <div class="learning-text">${l.learning}</div>
                  <div class="learning-meta">
                    <span>${l.person}</span>
                    <span>${l.date}</span>
                    <span class="importance-badge ${l.importance}">${l.importance}</span>
                  </div>
                </div>
              `).join('')}
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // --- Company Tab ---
    function categorizeSkill(skill) {
      const s = skill.toLowerCase();
      if (s.includes('next.js') || s.includes('react') || s.includes('vue') || s.includes('angular') ||
          s.includes('svelte') || s.includes('frontend') || s.includes('tailwind') || s.includes('css') ||
          s.includes('html') || s.includes('web app')) return 'Frontend';
      if (s.includes('node') || s.includes('express') || s.includes('api') || s.includes('server') ||
          s.includes('backend') || s.includes('middleware')) return 'Backend';
      if (s.includes('prisma') || s.includes('postgres') || s.includes('mongo') || s.includes('database') ||
          s.includes('sql') || s.includes('redis') || s.includes('migration') || s.includes('schema')) return 'Data';
      if (s.includes('stripe') || s.includes('payment') || s.includes('billing') ||
          s.includes('connect')) return 'Payments';
      if (s.includes('docker') || s.includes('kubernetes') || s.includes('aws') || s.includes('deploy') ||
          s.includes('ci') || s.includes('devops') || s.includes('infrastructure')) return 'Infrastructure';
      if (s.includes('auth') || s.includes('security') || s.includes('oauth') ||
          s.includes('jwt')) return 'Auth & Security';
      if (s.includes('claude') || s.includes('ai') || s.includes('llm') || s.includes('agent') ||
          s.includes('subagent') || s.includes('skill')) return 'AI & Agents';
      if (s.includes('test') || s.includes('tdd') || s.includes('jest') ||
          s.includes('playwright')) return 'Testing';
      return 'General';
    }

    function renderCompany() {
      const container = document.getElementById('company-list');
      const statsEl = document.getElementById('company-stats');
      const query = searchQuery.toLowerCase();

      let filtered = skillsData;
      if (query) {
        filtered = filtered.filter(s =>
          s.skill.toLowerCase().includes(query) ||
          s.person.toLowerCase().includes(query) ||
          categorizeSkill(s.skill).toLowerCase().includes(query)
        );
      }

      // Group by category
      const categories = {};
      for (const s of filtered) {
        const cat = categorizeSkill(s.skill);
        if (!categories[cat]) categories[cat] = {};
        if (!categories[cat][s.skill]) categories[cat][s.skill] = [];
        if (!categories[cat][s.skill].includes(s.person)) {
          categories[cat][s.skill].push(s.person);
        }
      }

      const catNames = Object.keys(categories).sort();
      const totalSkills = new Set(filtered.map(s => s.skill.toLowerCase())).size;
      const totalPeople = new Set(filtered.map(s => s.person)).size;
      statsEl.textContent = `${totalSkills} skills across ${catNames.length} categories, ${totalPeople} people`;

      if (catNames.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No company knowledge found.</p></div>';
        return;
      }

      container.innerHTML = catNames.map(cat => `
        <div class="category-section">
          <div class="category-header">${cat}</div>
          ${Object.entries(categories[cat]).map(([skill, people]) => `
            <div class="category-skill-row">
              <div class="category-skill-name">${skill}</div>
              <div class="category-skill-people">
                ${people.map(p => `<span class="person-badge">${p}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // --- Render ---
    function render() {
      document.getElementById('individual-panel').classList.add('hidden');
      document.getElementById('project-panel').classList.add('hidden');
      document.getElementById('company-panel').classList.add('hidden');

      if (activeTab === 'individual') {
        document.getElementById('individual-panel').classList.remove('hidden');
        renderIndividual();
      } else if (activeTab === 'project') {
        document.getElementById('project-panel').classList.remove('hidden');
        renderProject();
      } else {
        document.getElementById('company-panel').classList.remove('hidden');
        renderCompany();
      }
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        render();
      });
    });

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    loadData();
  </script>
</body>
</html>
